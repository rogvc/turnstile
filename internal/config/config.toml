  'GIT_CONFIG_SYSTEM', 'GIT_CONFIG_COUNT', 'GIT_CONFIG_PARAMETERS', 'GIT_ATTR_SOURCE',
  'SSH_ASKPASS', 'SSH_ASKPASS_REQUIRE', 'CURL_HOME',
