  'JAVA_TOOL_OPTIONS', '_JAVA_OPTIONS', 'JDK_JAVA_OPTIONS', 'CLASSPATH',
  'LUA_INIT', 'LUA_INIT_5_4', 'LUA_PATH', 'LUA_CPATH',
  'R_PROFILE', 'R_PROFILE_USER', 'R_ENVIRON', 'R_ENVIRON_USER',
  'R_LIBS', 'R_LIBS_USER',
  'DOTNET_STARTUP_HOOKS',
