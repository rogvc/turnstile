version: 2

builds:
  - main: .
    binary: turnstile
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

nfpms:
  - id: turnstile
    package_name: turnstile
    homepage: https://github.com/rogvc/turnstile
    description: Allowlist-based command filter for Claude Code
    license: MIT
    maintainer: Rogerio Valenca da Cruz <rogvc@users.noreply.github.com>
    formats:
      - deb
      - rpm
    bindir: /usr/bin
