  'GCONV_PATH', 'LOCPATH', 'NLSPATH', 'HOSTALIASES', 'TZDIR',
  'EDITOR', 'VISUAL', 'PAGER', 'MANPAGER', 'LESSOPEN', 'LESSCLOSE',
